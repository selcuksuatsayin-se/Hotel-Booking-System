# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - hotel-gateway-selcuk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # DÜZELTME BURADA:
      # Sadece 'dotnet publish' yeterli (build işlemini de yapar).
      # Kritik nokta: Proje dosyasının yolunu (HotelAdminService/HotelAdminService.csproj) belirttik.
      # Çıktıyı 'myapp' klasörüne veriyoruz.
      - name: dotnet publish
        run: dotnet publish HotelAdminService/HotelBookingService/HotelBookingService.csproj -c Release -o myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: myapp # Sadece derlenmiş dosyaların olduğu klasörü paketle

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7E85B2AAB61D47E29F7CB83E1A83C02F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0676122BEB748068A66E7AF30A46D81 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AB404115F45042879635F4C2E482AEE7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hotel-gateway-selcuk'
          slot-name: 'Production'
          package: .

          
